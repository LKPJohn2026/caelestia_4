# Cursor's agent sandbox points npm/pip/uv/Playwright/… caches at /tmp/cursor-sandbox-cache/<random-per-start>
# and never removes old ones. /tmp is RAM (tmpfs), so they pile up in memory/zram (26 GiB on 2026-10-11).
# Remove anything inside it not used for a day. Run by systemd-tmpfiles-clean.timer (user, daily).
e /tmp/cursor-sandbox-cache - - - 1d
