# The bug form has a box "I ticked these boxes without reading them": an issue that ticks it is closed with a comment
# that says why and how to get it reopened, so a report written with the form actually read can be opened again.
# Runs on `issues` (no pull-request code is ever checked out); the issue body is only read by the `if:` expression,
# never put into a shell command.
name: Close issues that skipped the form

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  close:
    if: contains(github.event.issue.body, '- [X] I ticked these boxes without reading them')
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --body "Closed automatically: the form's box *I ticked these boxes without reading them* is ticked. That is all this check looks at; nobody has judged the report itself.

          This is a one-person fork, so the form asks for what is needed to reproduce a bug, above all the \`./diagnose\` output. What is in scope is in [SCOPE.md](https://github.com/$GH_REPO/blob/main/SCOPE.md).

          To go on: edit this issue, untick that box, fill in anything missing, then leave a comment here and the maintainer will reopen it. Starting over with the [bug form](https://github.com/$GH_REPO/issues/new?template=1-bug.yml) works too."
          gh issue close "$NUMBER" --reason "not planned"
