# tools/ci-lint.sh on every push to main and every pull request. It only reads the files: the job has read-only
# access and no secrets, so pull requests from forks run it the same way.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        # Only what the runner image lacks (it usually has jq and shellcheck, not luac). Ubuntu's mirrors fail now and
        # then (DNS, a mirror down): apt retries each download, each apt-get is cut off after 3 minutes, and the step
        # is tried 3 times a minute apart before the job fails
        run: |
          need=()
          command -v luac5.4 >/dev/null || command -v luac >/dev/null || need+=(lua5.4)
          command -v jq >/dev/null || need+=(jq)
          command -v shellcheck >/dev/null || need+=(shellcheck)
          [ "${#need[@]}" -eq 0 ] && { echo "all tools there"; exit 0; }
          echo "installing: ${need[*]}"
          for attempt in 1 2 3; do
            timeout 180 sudo apt-get -o Acquire::Retries=5 update -qq &&
              timeout 180 sudo apt-get -o Acquire::Retries=5 install -y -qq "${need[@]}" && exit 0
            echo "::warning::apt-get failed (attempt $attempt of 3)"
            [ "$attempt" -lt 3 ] && sleep 60
          done
          exit 1
      - name: tools/ci-lint.sh
        env:
          CI: "true"
        run: tools/ci-lint.sh
