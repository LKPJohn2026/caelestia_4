[preferred]
default = hyprland;gtk
# caelestia4: Open/Save dialogs from Wormhole (caelestia4-wormhole package); GTK's when it isn't installed.
# Only the FileChooser: Wormhole's other interfaces are partly stubs, so it is never the default
org.freedesktop.impl.portal.FileChooser = wormhole;gtk
# caelestia4: interfaces neither hyprland nor gtk has (KDE's portal had them; it goes with Plasma). Off, so Wormhole,
# whose versions are stubs, is not picked for them through its UseIn key
org.freedesktop.impl.portal.Background = none
org.freedesktop.impl.portal.Clipboard = none
org.freedesktop.impl.portal.Usb = none
org.freedesktop.impl.portal.Wallpaper = none
# caelestia4: secrets for sandboxed apps from gnome-keyring (the Secret Service since KWallet's keys moved)
org.freedesktop.impl.portal.Secret = gnome-keyring
