[preferred]
default = hyprland;gtk
# caelestia4: Open/Save dialogs from Wormhole (caelestia4-wormhole package); GTK's when it isn't installed.
# Only the FileChooser: Wormhole's other interfaces are partly stubs, so it is never the default
org.freedesktop.impl.portal.FileChooser = wormhole;gtk
# caelestia4: interfaces neither hyprland nor gtk has (KDE's portal had them; it goes with Plasma). Off, so Wormhole,
# whose versions are stubs, is not picked for them through its UseIn key
org.freedesktop.impl.portal.Background = none
org.freedesktop.impl.portal.Clipboard = none
org.freedesktop.impl.portal.Usb = none
org.freedesktop.impl.portal.Wallpaper = none
# caelestia4: remote input (KDE Connect's mouse and keyboard). Neither hyprland nor gtk has it, so Wormhole's stub
# (says yes to every app, then drops the input) would win through UseIn. hypr-kdeconnect's bridge is the real one: the
# installer puts it here when /usr/share/xdg-desktop-portal/portals/hypr-kdeconnect.portal exists, and none back when
# that file is gone. A pin to a portal that isn't installed falls through to UseIn, so the default is none.
# InputCapture and GlobalShortcuts come from hyprland, Inhibit, Notification, Access and Settings from gtk (default
# above). Camera, Location and Realtime are not looked up from a backend at all (x-d-p asks Access and Lockdown).
org.freedesktop.impl.portal.RemoteDesktop = none
# caelestia4: secrets for sandboxed apps from gnome-keyring (the Secret Service since KWallet's keys moved)
org.freedesktop.impl.portal.Secret = gnome-keyring
