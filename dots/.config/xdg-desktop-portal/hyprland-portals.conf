[preferred]
default = hyprland;gtk
# caelestia4: Open/Save dialogs from Wormhole (caelestia4-wormhole package); KDE's when it isn't installed.
# Only the FileChooser: Wormhole's other interfaces are partly stubs, so it is never the default
org.freedesktop.impl.portal.FileChooser = wormhole;kde
# caelestia4: interfaces neither hyprland nor gtk has. Pinned to KDE's (as before) so Wormhole, whose versions are
# stubs, is not picked for them through its UseIn key
org.freedesktop.impl.portal.Background = kde
org.freedesktop.impl.portal.Clipboard = kde
org.freedesktop.impl.portal.Usb = kde
org.freedesktop.impl.portal.Wallpaper = kde
