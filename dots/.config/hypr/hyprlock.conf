# caelestia4: hyprlock in the style of Caelestia's lock screen (third_party/caelestia-shell/modules/lock):
# blurred wallpaper, one rounded translucent panel, three columns:
#   left   = weather, system ("fetch"), media
#   centre = big clock (hours primary / minutes secondary), date in caps, avatar, pill password field
#   right  = resources, notifications (+ locked since, keyboard layout)
# Colours come from the wallpaper via matugen (hyprlock/colors.conf; template matugen/templates/hyprland/hyprlock-colors.conf).
# Card scripts live in hyprlock/caelestia/. Fonts: Google Sans Flex (Caelestia's UI font, installed to
# ~/.local/share/fonts/caelestia4), Material Symbols Rounded for icons.
source = ~/.config/hypr/hyprlock/colors.conf

$cards = ~/.config/hypr/hyprlock/caelestia
# horizontal offset of the side columns from the centre
$col = 600

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = emphasized, 0.05, 0.7, 0.1, 1
    animation = fadeIn, 1, 5, emphasized
    animation = fadeOut, 1, 4, emphasized
    animation = inputFieldDots, 1, 2, emphasized
}

background {
    monitor =
    path = $background_image
    color = $surface_panel
    blur_passes = 3
    blur_size = 10
    brightness = 0.6
    vibrancy = 0.2
    noise = 0.01
}

# ---------------------------------------------------------------- panel
shape {
    monitor =
    size = 1780, 830
    color = $surface_panel
    rounding = 36
    border_size = 0
    position = 0, 30
    halign = center
    valign = center
    zindex = 0
}

# ---------------------------------------------------------------- centre column
label { # hours
    monitor =
    text = cmd[update:1000] date +%H
    color = $primary
    font_size = 150
    font_family = $font_caelestia_clock
    position = 0, 290
    halign = center
    valign = center
    zindex = 2
}

label { # minutes
    monitor =
    text = cmd[update:1000] date +%M
    color = $secondary
    font_size = 150
    font_family = $font_caelestia_clock
    position = 0, 120
    halign = center
    valign = center
    zindex = 2
}

label { # date, Caelestia: "dddd • d MMM" upper case
    monitor =
    text = cmd[update:60000] date +"%A • %-d %b" | tr '[:lower:]' '[:upper:]'
    color = $on_surface
    font_size = 18
    font_family = $font_caelestia Medium
    position = 0, 10
    halign = center
    valign = center
    zindex = 2
}

shape { # avatar circle (no ~/.face set, so a person symbol)
    monitor =
    size = 112, 112
    color = $surface_container_high
    rounding = -1
    position = 0, -110
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = person
    color = $primary
    font_size = 54
    font_family = Material Symbols Rounded
    position = 0, -110
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 420, 60
    rounding = -1
    outline_thickness = 0
    inner_color = $surface_container_high
    outer_color = $surface_container_high
    font_color = $on_surface
    font_family = $font_caelestia
    check_color = $primary
    fail_color = $error
    capslock_color = $tertiary
    placeholder_text = <span foreground="##c3c7cf">Nhập mật khẩu</span>
    fail_text = <i>$FAIL</i> ($ATTEMPTS)
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    position = 0, -240
    halign = center
    valign = center
    zindex = 2
}

label { # caps lock / layout hint
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $tertiary
    font_size = 13
    font_family = $font_caelestia
    position = 0, -305
    halign = center
    valign = center
    zindex = 2
}

# ---------------------------------------------------------------- left column
shape { # weather card
    monitor =
    size = 460, 150
    color = $surface_container
    rounding = 24
    position = -$col, 320
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:600000] $cards/weather.sh
    color = $on_surface
    font_size = 15
    font_family = $font_caelestia
    position = -$col, 320
    halign = center
    valign = center
    zindex = 2
}

shape { # system card
    monitor =
    size = 460, 250
    color = $surface_container
    rounding = 24
    position = -$col, 90
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] $cards/fetch.sh
    color = $on_surface
    font_size = 14
    font_family = $font_caelestia
    text_align = left
    position = -$col, 90
    halign = center
    valign = center
    zindex = 2
}

shape { # media card
    monitor =
    size = 460, 260
    color = $surface_container
    rounding = 24
    position = -$col, -205
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = music_note
    color = $primary
    font_size = 40
    font_family = Material Symbols Rounded
    position = -$col, -135
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:2000] $cards/media.sh
    color = $on_surface
    font_size = 15
    font_family = $font_caelestia
    text_align = center
    position = -$col, -235
    halign = center
    valign = center
    zindex = 2
}

# ---------------------------------------------------------------- right column
shape { # resources card
    monitor =
    size = 460, 300
    color = $surface_container
    rounding = 24
    position = $col, 245
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = memory
    color = $primary
    font_size = 36
    font_family = Material Symbols Rounded
    position = $col, 335
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:3000] $cards/resources.sh
    color = $on_surface
    font_size = 14
    font_family = $font_caelestia
    text_align = left
    position = $col, 215
    halign = center
    valign = center
    zindex = 2
}

shape { # notifications card (Caelestia's lock lists notifications here)
    monitor =
    size = 460, 400
    color = $surface_container
    rounding = 24
    position = $col, -135
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = notifications
    color = $primary
    font_size = 36
    font_family = Material Symbols Rounded
    position = $col, -10
    halign = center
    valign = center
    zindex = 2
}

label { # newest notifications: app and summary only (no body), see the script
    monitor =
    text = cmd[update:5000] $cards/notifications.sh
    color = $on_surface
    font_size = 14
    font_family = $font_caelestia
    text_align = center
    position = $col, -130
    halign = center
    valign = center
    zindex = 2
}

label { # locked since + keyboard layout
    monitor =
    text = cmd[update:0] echo "<span alpha='70%'>Khoá lúc $(date +%H:%M)  ·  Bàn phím</span>  $LAYOUT"
    color = $on_surface
    font_size = 13
    font_family = $font_caelestia
    position = $col, -295
    halign = center
    valign = center
    zindex = 2
}
