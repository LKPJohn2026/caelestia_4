# caelestia4: the lock screen for a screen too small for layout-full.conf (a laptop, a portrait monitor): its centre
# column with a smaller clock, in 460x610 device pixels. The password field is the same as there, see that file.

shape {
    monitor =
    size = 460, 610
    color = $surface_panel
    rounding = 36
    border_size = 0
    position = 0, -25
    halign = center
    valign = center
    zindex = 0
}

label { # hours
    monitor =
    text = cmd[update:1000] date +%H
    color = $primary
    font_size = 96
    font_family = $font_caelestia_clock
    position = 0, 202
    halign = center
    valign = center
    zindex = 2
}

label { # minutes
    monitor =
    text = cmd[update:1000] date +%M
    color = $secondary
    font_size = 96
    font_family = $font_caelestia_clock
    position = 0, 93
    halign = center
    valign = center
    zindex = 2
}

label { # date, Caelestia: "dddd • d MMM" upper case
    monitor =
    text = cmd[update:60000] date +"%A • %-d %b" | tr '[:lower:]' '[:upper:]'
    color = $on_surface
    font_size = 18
    font_family = $font_caelestia Medium
    position = 0, 10
    halign = center
    valign = center
    zindex = 2
}

shape { # avatar circle (no ~/.face set, so a person symbol)
    monitor =
    size = 112, 112
    color = $surface_container_high
    rounding = -1
    position = 0, -110
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = person
    color = $primary
    font_size = 54
    font_family = Material Symbols Rounded
    position = 0, -110
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 420, 60
    rounding = -1
    outline_thickness = 0
    inner_color = $surface_container_high
    outer_color = $surface_container_high
    font_color = $on_surface
    font_family = $font_caelestia
    check_color = $primary
    fail_color = $error
    capslock_color = $tertiary
    placeholder_text = <span foreground="##c3c7cf">$str_password</span>
    fail_text = <i>$FAIL</i> ($ATTEMPTS)
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    position = 0, -240
    halign = center
    valign = center
    zindex = 2
}

label { # caps lock / layout hint
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $tertiary
    font_size = 13
    font_family = $font_caelestia
    position = 0, -305
    halign = center
    valign = center
    zindex = 2
}
