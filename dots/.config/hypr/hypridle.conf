$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' & pidof qs quickshell hyprlock || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
    inhibit_sleep = 3
}

# caelestia4: the timers (lock / screen off / suspend) and "lock before sleep" are set in the settings app
# (Power & idle) and written to this file by scripts/caelestia4/hypridle-timeouts.sh. A later general block there
# overrides before_sleep_cmd above.
source = ~/.config/hypr/hypridle-timeouts.conf
