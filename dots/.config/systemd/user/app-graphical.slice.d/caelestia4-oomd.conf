# caelestia4: under uwsm every app is its own scope in app-graphical.slice. When the slice stays under memory
# pressure, systemd-oomd kills the one app scope causing it, instead of the system thrashing or a guess across
# the whole user slice. The shell (session-graphical.slice) and background services aren't in this slice.
# Check: oomctl   (look for app-graphical.slice under "Memory Pressure Monitored CGroups")
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=60%
